full_name:
  form: survey
  label: Full name
  input_type: text_field
  value_type: string
  required: true
  position: 1

years_experience:
  form: survey
  label: Years of experience
  input_type: number_field
  value_type: number
  required: false
  position: 2

start_date:
  form: survey
  label: Start date
  input_type: date_field
  value_type: date
  required: false
  position: 3

team:
  form: survey
  label: Team
  input_type: select
  value_type: string
  choices: [ Design, Engineering, Support ]
  required: false
  position: 4

perks:
  form: survey
  label: Perks used
  input_type: check_box
  value_type: string
  choices: [ Gym, Transit ]
  required: false
  position: 5

locked_note:
  form: locked_form
  label: Note
  input_type: text_field
  value_type: string
  required: false
  position: 1
